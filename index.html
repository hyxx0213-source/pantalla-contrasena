
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Con Amor ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 22px 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f9dce8, #e8dafa, #d8e8ff);
    color: #9f6689;
}

.pantalla {
    width: 100%;
    max-width: 390px;
    text-align: center;
}

.encabezado {
    margin-bottom: 18px;
    color: #b87fa4;
    font-size: 14px;
    letter-spacing: 3px;
    font-weight: bold;
}

.tarjeta {
    width: 100%;
    padding: 28px 24px 24px;
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 12px 35px rgba(179, 126, 166, .16);
}

.corazon {
    color: #e7a6cd;
    font-size: 36px;
    margin-bottom: 12px;
}

h1 {
    margin: 0 0 10px;
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: normal;
    color: #bd80a6;
}

.subtitulo {
    margin: 0 auto 25px;
    font-size: 13px;
    line-height: 1.6;
    color: #b79aae;
}

.caja-fecha {
    width: 100%;
    padding: 10px 5px 17px;
    margin-bottom: 18px;
    border: 1px solid #f4d9e8;
    border-radius: 17px;
    background: #fffafd;
}

.etiquetas,
.puntos {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    width: 100%;
}

.etiquetas {
    margin-bottom: 16px;
    color: #d49abd;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.etiquetas span:nth-child(1) {
    grid-column: 1 / 3;
}

.etiquetas span:nth-child(2) {
    grid-column: 3 / 5;
}

.etiquetas span:nth-child(3) {
    grid-column: 5 / 9;
}

.puntos {
    gap: 0;
    justify-items: center;
    align-items: center;
}

.punto {
    width: 13px;
    height: 13px;
    border: 2px solid #e7a6cd;
    border-radius: 50%;
    background: transparent;
}

.punto.lleno {
    background: #e7a6cd;
}

.teclado {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto 19px;
}

.tecla {
    min-height: 57px;
    border: 1px solid #f4dce9;
    border-radius: 15px;
    background: #fff5fa;
    color: #b779a0;
    font-size: 22px;
    cursor: pointer;
    transition: background .15s, transform .15s;
}

.tecla:active {
    background: #f7d9e9;
    transform: scale(.96);
}

.tecla small {
    display: block;
    margin-top: 3px;
    font-size: 8px;
    letter-spacing: 1px;
    color: #c9a4bb;
}

.tecla.especial {
    font-size: 17px;
    background: #fceaf3;
}

.descubrir {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(100deg, #e8b2d1, #d8b6e7);
    color: white;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: .4px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(203, 153, 198, .2);
}

.descubrir:active {
    transform: scale(.98);
}

.mensaje {
    min-height: 22px;
    margin: 14px 0 0;
    font-size: 13px;
    color: #c17da5;
}

.pie {
    margin-top: 18px;
    font-size: 11px;
    color: #bd91b0;
    letter-spacing: 1px;
}

@media (max-width: 350px) {
    .tarjeta {
        padding: 23px 17px;
    }

    h1 {
        font-size: 22px;
    }

    .tecla {
        min-height: 51px;
    }
}
</style>
</head>

<body>
<main class="pantalla">

    <div class="encabezado">CON AMOR ♡</div>

    <section class="tarjeta">

        <div class="corazon">♡</div>

        <h1>Introduce la fecha especial</h1>

        <p class="subtitulo">
            Una pequeña pista para abrir tu sorpresa
        </p>

        <div class="caja-fecha">

            <div class="etiquetas">
                <span>DD</span>
                <span>MM</span>
                <span>AAAA</span>
            </div>

            <div class="puntos" id="puntos">
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
            </div>

        </div>

        <div class="teclado">

            <button class="tecla" data-num="1">1<small>&nbsp;</small></button>
            <button class="tecla" data-num="2">2<small>ABC</small></button>
            <button class="tecla" data-num="3">3<small>DEF</small></button>

            <button class="tecla" data-num="4">4<small>GHI</small></button>
            <button class="tecla" data-num="5">5<small>JKL</small></button>
            <button class="tecla" data-num="6">6<small>MNO</small></button>

            <button class="tecla" data-num="7">7<small>PQRS</small></button>
            <button class="tecla" data-num="8">8<small>TUV</small></button>
            <button class="tecla" data-num="9">9<small>WXYZ</small></button>

            <button class="tecla especial" id="limpiar">C</button>
            <button class="tecla" data-num="0">0<small>&nbsp;</small></button>
            <button class="tecla especial" id="borrar" aria-label="Borrar último número">⌫</button>

        </div>

        <button class="descubrir" id="confirmar">
            Descubrir sorpresa ♡
        </button>

        <p class="mensaje" id="mensaje" aria-live="polite"></p>

    </section>

    <div class="pie">♡ HECHO CON AMOR ♡</div>

</main>

<script>
const CONTRASENA = "19122025";
let entrada = "";

const puntos = document.querySelectorAll(".punto");
const mensaje = document.getElementById("mensaje");

function actualizarPuntos() {
    puntos.forEach((punto, indice) => {
        punto.classList.toggle("lleno", indice < entrada.length);
    });
}

function agregarNumero(numero) {
    if (entrada.length >= 8) return;

    entrada += numero;
    mensaje.textContent = "";
    actualizarPuntos();
}

document.querySelectorAll("[data-num]").forEach(boton => {
    boton.addEventListener("click", () => {
        agregarNumero(boton.dataset.num);
    });
});

function borrarUltimo() {
    entrada = entrada.slice(0, -1);
    mensaje.textContent = "";
    actualizarPuntos();
}

document.getElementById("borrar").addEventListener("click", borrarUltimo);

document.getElementById("limpiar").addEventListener("click", () => {
    entrada = "";
    mensaje.textContent = "";
    actualizarPuntos();
});

function verificar() {
    if (entrada.length !== 8) {
        mensaje.textContent = "Completa los ocho números ♡";
        return;
    }

    if (entrada === CONTRASENA) {
        mensaje.textContent = "¡Fecha correcta! ♡";
    } else {
        mensaje.textContent = "Inténtalo de nuevo ♡";
    }
}

document.getElementById("confirmar").addEventListener("click", verificar);
</script>

</body>
</html>
