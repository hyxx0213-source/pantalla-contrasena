<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Con Amor ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fbe6f1;
    font-family: Georgia, "Times New Roman", serif;
    color: #741451;
}

.pantalla {
    width: 100%;
    max-width: 390px;
    padding: 18px 15px 12px;
    background: #f9e0ee;
    text-align: center;
    border: 1px solid #f3d0e5;
}

.encabezado {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 0 0 26px;
    font-size: 18px;
}

.linea {
    height: 2px;
    flex: 1;
    background: #e9b5d7;
}

.tarjeta {
    width: 100%;
    padding: 16px 12px 12px;
    background: #fff;
    border-radius: 15px;
}

.corazon {
    width: 58px;
    height: 58px;
    margin: 0 auto 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: #fbeafa;
    color: #d99bcf;
    font-family: Arial, sans-serif;
    font-size: 45px;
    line-height: 1;
}

h1 {
    margin: 8px 0 5px;
    font-size: clamp(25px, 7vw, 29px);
    line-height: 1.12;
    font-weight: bold;
    color: #741451;
}

.subtitulo {
    margin: 8px 0 17px;
    font-size: 10px;
}

.caja-fecha {
    padding: 6px 5px 15px;
    border: 2px solid #efc3e2;
    border-radius: 6px;
    background: #fff8fd;
}


.etiquetas {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    align-items: center;
    margin-bottom: 17px;
    color: #dfa5ce;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}

.etiquetas span:nth-child(1) {
    grid-column: 1 / 3;
}

.etiquetas span:nth-child(2) {
    grid-column: 3 / 5;
}

.etiquetas span:nth-child(3) {
    grid-column: 5 / 9;
}

.etiquetas span {
    width: 100%;
    text-align: center;
}



.puntos {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    justify-items: center;
    align-items: center;
    width: 100%;
    gap: 0;
}


.punto {
    width: clamp(11px, 3.2vw, 14px);
    height: clamp(11px, 3.2vw, 14px);
    flex: 0 0 auto;
    border: 2px solid #e9acd6;
    border-radius: 50%;
    background: transparent;
    transition: background .15s, transform .15s;
}

.punto.lleno {
    background: #d88bc1;
    border-color: #d88bc1;
    transform: scale(1.04);
}

.teclado {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 11px 16px;
    margin: 14px 7px 25px;
}

.tecla {
    height: 47px;
    border: none;
    border-radius: 12px;
    background: #fceafa;
    color: #874a79;
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s, transform .12s;
}

.tecla:active {
    background: #f2d3eb;
    transform: scale(.96);
}

.tecla svg {
    width: 25px;
    height: 25px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.descubrir {
    width: 100%;
    min-height: 40px;
    border: none;
    border-radius: 11px;
    background: #f3d9ee;
    color: #741451;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    cursor: pointer;
    padding: 9px 5px;
}

.descubrir:active {
    background: #eac8e4;
}

.mensaje {
    min-height: 18px;
    margin: 8px 0 0;
    font-size: 12px;
    color: #874a79;
}

@media (max-width: 340px) {
    .teclado {
        gap: 9px;
        margin-left: 3px;
        margin-right: 3px;
    }

    .tecla {
        height: 44px;
    }

    .tarjeta {
        padding-left: 9px;
        padding-right: 9px;
    }
}
</style>
</head>

<body>
<main class="pantalla">

    <header class="encabezado">
        <span class="linea"></span>
        <span>Con Amor</span>
        <span class="linea"></span>
    </header>

    <section class="tarjeta">

        <div class="corazon">♡</div>

        <h1>Introduce la fecha<br>especial</h1>

        <p class="subtitulo">
            Una pequeña pista para abrir tu sorpresa
        </p>

        <div class="caja-fecha">

            <div class="etiquetas">
                <span>DD</span>
                <span>MM</span>
                <span>AAAA</span>
            </div>

            <div class="puntos" id="puntos">
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
            </div>

        </div>

        <div class="teclado">

            <button class="tecla" data-num="1">1</button>
            <button class="tecla" data-num="2">2</button>
            <button class="tecla" data-num="3">3</button>

            <button class="tecla" data-num="4">4</button>
            <button class="tecla" data-num="5">5</button>
            <button class="tecla" data-num="6">6</button>

            <button class="tecla" data-num="7">7</button>
            <button class="tecla" data-num="8">8</button>
            <button class="tecla" data-num="9">9</button>

            <button class="tecla" id="borrar"
                aria-label="Borrar último número">
                <svg viewBox="0 0 24 24">
                    <path d="M9 5H21V19H9L2 12Z"/>
                    <path d="M12 9L18 15M18 9L12 15"/>
                </svg>
            </button>

            <button class="tecla" data-num="0">0</button>

            <button class="tecla" id="confirmar"
                aria-label="Confirmar contraseña">
                <svg viewBox="0 0 24 24">
                    <path d="M4 12L10 18L21 6"/>
                </svg>
            </button>

        </div>

        <button class="descubrir" id="descubrir">
            Descubrir sorpresa
        </button>

        <p class="mensaje" id="mensaje" 
        <p class="mensaje" id="mensaje" aria-live="polite"></p>

    </section>

    <section class="tarjeta" id="siguiente-pantalla" hidden>
        <div class="corazon">♡</div>
        <h1>¡Lo lograste!</h1>
        <p class="subtitulo">
            Has desbloqueado tu sorpresa ♡
        </p>
    </section>

</main>

<script>
const CONTRASENA = "19122025";
let entrada = "";

const puntos = document.querySelectorAll("#puntos .punto");
const mensaje = document.getElementById("mensaje");

function actualizarPuntos() {
    puntos.forEach((punto, indice) => {
        punto.classList.toggle("lleno", indice < entrada.length);
    });
}

function agregarNumero(numero) {
    if (entrada.length >= 8) return;

    entrada += numero;
    mensaje.textContent = "";
    actualizarPuntos();
}

document.querySelectorAll("[data-num]").forEach(boton => {
    boton.addEventListener("click", () => {
        agregarNumero(boton.dataset.num);
    });
});

function borrarUltimo() {
    entrada = entrada.slice(0, -1);
    mensaje.textContent = "";
    actualizarPuntos();
}

document.getElementById("borrar").addEventListener("click", borrarUltimo);

function verificar() {
    if (entrada.length !== 8) {
        mensaje.textContent = "Completa los ocho números ♡";
        return;
    }

    if (entrada === CONTRASENA) {
        document.querySelector(".encabezado").hidden = true;
        document.querySelector(".tarjeta").hidden = true;
        document.getElementById("siguiente-pantalla").hidden = false;
    } else {
        mensaje.textContent = "Inténtalo de nuevo ♡";
    }
}

document.getElementById("confirmar").addEventListener("click", verificar);
document.getElementById("descubrir").addEventListener("click", verificar);
</script>

</body>
</html>
