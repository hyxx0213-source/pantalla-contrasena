<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla de bloqueo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(160deg, #f9dce8, #e8dafa, #d8e8ff);
    color: #ffffff;
}

.celular {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    padding: 35px 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    background: linear-gradient(160deg, #f5c8dd, #d5c6f5, #c4dafa);
    text-align: center;
}

.hora {
    font-size: 58px;
    font-weight: 300;
    margin-top: 10px;
}

.fecha {
    font-size: 17px;
    margin-top: -15px;
}

.icono {
    font-size: 42px;
    margin-top: 10px;
}

h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

p {
    font-size: 14px;
}

.puntos {
    display: flex;
    gap: 13px;
    margin: 25px 0;
}

.punto {
    width: 13px;
    height: 13px;
    border: 2px solid white;
    border-radius: 50%;
    background: transparent;
}

.punto.lleno {
    background: white;
}

.teclado {
    display: grid;
    grid-template-columns: repeat(3, 70px);
    gap: 13px;
    justify-content: center;
    margin-top: 10px;
}

.tecla {
    width: 70px;
    height: 62px;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 20px;
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.tecla:active {
    background: rgba(255,255,255,0.55);
}

.letra {
    display: block;
    font-size: 9px;
    margin-top: 3px;
    letter-spacing: 2px;
}

.mensaje {
    min-height: 20px;
    font-size: 14px;
    margin-top: 15px;
}

.borrar {
    font-size: 22px;
}

.pie {
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="celular">

    <div>
        <div class="hora" id="hora">20:25</div>
        <div class="fecha" id="fecha">Un día especial ♡</div>
    </div>

    <div class="icono">♡</div>

    <div>
        <h2>Introduce tu contraseña</h2>
        <p>Ingresa tu código para continuar</p>

        <div class="puntos" id="puntos">
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>
        </div>

        <div class="teclado">
            <button class="tecla" data-num="1">1</button>
            <button class="tecla" data-num="2">2<span class="letra">ABC</span></button>
            <button class="tecla" data-num="3">3<span class="letra">DEF</span></button>

            <button class="tecla" data-num="4">4<span class="letra">GHI</span></button>
            <button class="tecla" data-num="5">5<span class="letra">JKL</span></button>
            <button class="tecla" data-num="6">6<span class="letra">MNO</span></button>

            <button class="tecla" data-num="7">7<span class="letra">PQRS</span></button>
            <button class="tecla" data-num="8">8<span class="letra">TUV</span></button>
            <button class="tecla" data-num="9">9<span class="letra">WXYZ</span></button>

            <button class="tecla" id="limpiar">C</button>
            <button class="tecla" data-num="0">0</button>
            <button class="tecla borrar" id="borrar">⌫</button>
        </div>

        <div class="mensaje" id="mensaje" aria-live="polite"></div>
    </div>

    <div class="pie">♡ Hecho con amor ♡</div>

</div>

<script>
const CONTRASENA = "19122025";
let entrada = "";

const puntos = document.querySelectorAll(".punto");
const mensaje = document.getElementById("mensaje");

function actualizarPuntos() {
    puntos.forEach((punto, indice) => {
        punto.classList.toggle("lleno", indice < entrada.length);
    });
}

function pulsarNumero(numero) {
    if (entrada.length >= CONTRASENA.length) return;

    entrada += numero;
    mensaje.textContent = "";
    actualizarPuntos();

    if (entrada.length === CONTRASENA.length) {
        if (entrada === CONTRASENA) {
            mensaje.textContent = "¡Contraseña correcta! ♡";
        } else {
            mensaje.textContent = "Contraseña incorrecta ♡";
        }
    }
}

document.querySelectorAll("[data-num]").forEach(boton => {
    boton.addEventListener("click", () => {
        pulsarNumero(boton.dataset.num);
    });
});

document.getElementById("borrar").addEventListener("click", () => {
    entrada = entrada.slice(0, -1);
    mensaje.textContent = "";
    actualizarPuntos();
});

document.getElementById("limpiar").addEventListener("click", () => {
    entrada = "";
    mensaje.textContent = "";
    actualizarPuntos();
});

function actualizarHora() {
    const ahora = new Date();

    document.getElementById("hora").textContent =
        ahora.toLocaleTimeString("es-MX", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });

    document.getElementById("fecha").textContent =
        ahora.toLocaleDateString("es-MX", {
            weekday: "long",
            day: "numeric",
            month: "long"
        });
}

actualizarHora();
setInterval(actualizarHora, 1000);
</script>

</body>
</html>
